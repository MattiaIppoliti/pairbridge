name: Source tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run offline source tests
        run: python3 -m unittest discover -s tests -v
      - name: Check validation with Python optimization enabled
        run: python3 -O -m unittest discover -s tests -p test_preparation.py -v
